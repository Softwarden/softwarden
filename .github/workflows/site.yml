# The softwarden.dev website (site/). It renders docs/*.md and CHANGELOG.md at build time and fails on a doc link it
# can't resolve, so it runs when any of the three changes. ci.yml skips changes that touch only site/.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Site build and doc links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        # Node 22, newer than the image's 22.16: Astro 7.4 needs 22.23.4 or later. The site is never in the image.
        with: { node-version: "22.23", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build

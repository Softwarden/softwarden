{{- /*
Secrets the chart makes when the operator brings none. Both are pre-install hooks, so
they exist before the migration job (also a hook) runs; Helm doesn't touch them on upgrade and never deletes them on
uninstall (hooks aren't part of the release, and resource-policy keep). Each one first looks the Secret up and re-emits
what is already there, so a reinstall (before-hook-creation replaces the hook object) keeps the same keys. Only a first
install generates values. `lookup` needs a live cluster: `helm template` and GitOps tools render without it and would
generate new keys on every render, so GitOps installs must set secrets.existingSecret and database.existingSecret.
Back the generated values up off the cluster (README).
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "softwarden.secretName" . }}
{{- $found := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $found.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "softwarden.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  django_secret_key: {{ $data.django_secret_key | default (randAlphaNum 64 | b64enc) | quote }}
  {{- /* A Fernet key: 32 random bytes in url-safe base64 (randBytes gives standard base64). */}}
  credential_keys: {{ $data.credential_keys | default (randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc) | quote }}
  backup_key: {{ $data.backup_key | default (randAlphaNum 64 | b64enc) | quote }}
  ops_token: {{ $data.ops_token | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
{{- if not .Values.database.existingSecret }}
{{- $name := printf "%s-database" (include "softwarden.fullname" .) }}
{{- $found := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $found.data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "softwarden.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $data.password }}
  password: {{ $data.password | quote }}
  {{- else }}
  password: {{ required "Set database.existingSecret (recommended) or database.password" .Values.database.password | b64enc | quote }}
  {{- end }}
{{- end }}

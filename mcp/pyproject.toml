[project]
name = "softwarden-mcp"
version = "1.0.0"
description = "Softwarden MCP server: answers questions about the catalog through the Softwarden REST API."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # The official MCP Python SDK. 2.3 is the current release and the first with the stable MCPServer API and the
    # 2026 protocol (server/discover) that the server is built on; <3 keeps a major change a deliberate upgrade.
    "mcp>=2.3,<3",
    # The REST client (softwarden_mcp/client.py). Already required by mcp (and by the API through anthropic), so no new
    # package; named here because the client imports it directly.
    "httpx2>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.17.3",
]

[project.scripts]
softwarden-mcp = "softwarden_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["softwarden_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# No test here should take more than a few seconds; a stall fails with a stack dump instead of hanging the run.
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is how pytest checks
    "E501",  # ruff format owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603"]  # synthetic tokens; the stdio test starts this package's own server

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "tests"
